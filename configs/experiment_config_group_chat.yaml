experiment:
  n_runs: 5
  crew_mode: group_chat
  output_dir: experiments/data
  results_csv: experiments/results.csv

llm:
  provider: openai             # openai | gemini
  model: gpt-4.1
  temperature: 0.2

# Group chat mode runs longer (6 agents, hierarchical debate).
# Increase delays accordingly to avoid rate limits.
rate_limits:
  delay_between_runs_seconds: 20
  delay_between_tickers_seconds: 60
  skip_alphavantage: false

tickers:
  # - { symbol: AAPL, sector: Technology }
  # - { symbol: MSFT, sector: Technology }
  # - { symbol: JPM,  sector: Finance }
  # - { symbol: BAC,  sector: Finance }
  - { symbol: JNJ,  sector: Healthcare }
  - { symbol: PFE,  sector: Healthcare }
  - { symbol: XOM,  sector: Energy }
  - { symbol: WMT,  sector: Consumer Staples }
  - { symbol: KO,   sector: Consumer Staples }
  - { symbol: CAT,  sector: Industrials }

  # Small caps (< $2B) — same sectors as above, so company size is the comparison variable
  - { symbol: PLAB, sector: Technology }
  - { symbol: PCRX, sector: Healthcare }
  - { symbol: KFRC, sector: Industrials }
