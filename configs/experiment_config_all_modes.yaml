experiment:
  n_runs: 5
  crew_modes:
    - single_agent
  output_dir: experiments/data_v3
  results_csv: experiments/results_v3.csv

llm:
  provider: openai
  model: gpt-4.1
  temperature: 0.2

# Delays to stay within API rate limits across all three modes.
# Total runs: 3 modes × 10 tickers × 5 runs = 150 runs.
# AlphaVantage free tier: 25 req/day — set skip_alphavantage: true if needed.
rate_limits:
  delay_between_runs_seconds: 15
  delay_between_tickers_seconds: 45
  skip_alphavantage: false

tickers:
  - { symbol: AAPL, sector: Technology }
  - { symbol: MSFT, sector: Technology }
  - { symbol: JPM,  sector: Finance }
  - { symbol: BAC,  sector: Finance }
  - { symbol: JNJ,  sector: Healthcare }
  - { symbol: PFE,  sector: Healthcare }
  - { symbol: XOM,  sector: Energy }
  - { symbol: WMT,  sector: Consumer Staples }
  - { symbol: KO,   sector: Consumer Staples }
  - { symbol: CAT,  sector: Industrials }
